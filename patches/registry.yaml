    retirement_condition: remove when upstream emits terminal, content-free per-physical-attempt receipts for main and auxiliary calls with retry/fallback lineage and streaming coverage, refuses to finalize paired current-turn todo, unsupported Blocked/Partial work, or machine-readable failure finals, preserves child completion truth, and rejects unknown cron toolsets before agent execution.
