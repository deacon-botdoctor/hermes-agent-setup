  - name: broker_codex_jobs_v1
    module: modules/broker_codex_jobs_v1.py
    function: patch_broker_codex_jobs_v1
    target: agent/codex_headers.py + agent/auxiliary_client.py + hermes_cli/auth.py + agent/broker_codex_jobs.py + agent/broker_codex_cli*.py + agent/broker_codex_history.py + agent/broker_cli_bin/codex* + hermes_cli/main.py + existing agent/agent_runtime_helpers.py broker carrier
    owner: engineering-lead
    idempotency: HERMES_BROKER_CODEX_JOBS_v1
    test: python3 -m pytest -q bin/test/test_patch_packaging_audit.py bin/test/test_runtime_payload_manifest.py
    smoke: python3 -m py_compile agent/auxiliary_client.py hermes_cli/auth.py agent/broker_codex_jobs.py agent/broker_codex_cli.py agent/broker_codex_cli_bootstrap.py agent/broker_codex_history.py agent/broker_cli_bin/codex hermes_cli/main.py
    rollback: rebind the prior immutable runtime through the operator executor; preserve broker pool state
    client_impact: restart_required
    tags: [auth, jobs, credential-pool]
    status: extracted
    route: irreducible
    reason: Delete optional native Codex request compression because retained client requests return HTTP400 with zstd and complete with raw JSON; native identity-header configuration restores main turns but direct auxiliary builders do not consistently inherit it, no plugin hook owns HTTP client construction, an upstream PR cannot repair installed clients now, and a sidecar would add an unnecessary service. The existing patch carrier removes compression at its native leaf hook. Delete cannot restore failed SDK or CLI jobs; config cannot implement quota recovery, retained-session reconstruction, or pool persistence; no plugin hook owns direct SDK calls, vendor CLI requests, or native auth writers; an upstream PR is the retirement path but cannot repair installed clients now; a standalone sidecar would require a new service and migrating every caller, while the existing patch carrier can bind a private per-process worker transport without a daemon.
    upstream_issue: none
    retirement_condition: native Codex transport sends accepted retained request bodies without this compression removal, and native auxiliary calls and vendor CLI workers exhaust eligible broker alternatives before output, preserve per-conversation ownership and broker metadata across subsequent requests with retained old reasoning, and recover retained plaintext sessions without replaying completed tools
  - name: conditional_api_admission_v1
    module: modules/conditional_api_admission_v1.py
    function: patch_conditional_api_admission_v1
    target: gateway/session_conditional_api.py + gateway/session_api_turn.py + gateway/session_authority.py + hermes_state_runtime.py + hermes_state_mutations.py + gateway/session_mutations.py + hermes_cli/plugins.py + gateway/platforms/api_server_runs.py + gateway/platforms/api_server.py + gateway/run_inbound.py + gateway/run_startup.py + hermes_cli/plugin_isolation.py + gateway/session_api.py + gateway/session_execution.py + agent/conditional_snapshot_policy.py + agent/agent_init.py + agent/tool_executor.py + agent/agent_runtime_helpers.py + agent/turn_context.py + agent/turn_request_assembly.py + agent/turn_api_request.py + model_tools.py + agent/turn_api_call.py + agent/relay_llm.py + hermes_cli/auth_codex_snapshot.py + gateway/run.py + agent/client_lifecycle.py + agent/conversation_loop.py + agent/codex_runtime.py + agent/turn_api_error.py + agent/turn_response_check.py
    owner: engineering-lead
    idempotency: HERMES_CONDITIONAL_API_ADMISSION_v1
    test: python3 -m pytest -q bin/test/test_patch_registry.py bin/test/test_patch_packaging_audit.py bin/test/test_runtime_payload_manifest.py
    smoke: python3 -m py_compile gateway/session_conditional_api.py gateway/session_api_turn.py gateway/session_authority.py hermes_state_runtime.py hermes_state_mutations.py gateway/session_mutations.py hermes_cli/plugins.py gateway/platforms/api_server_runs.py gateway/platforms/api_server.py gateway/run_inbound.py gateway/run_startup.py hermes_cli/plugin_isolation.py gateway/session_api.py gateway/session_execution.py agent/conditional_snapshot_policy.py agent/agent_init.py agent/tool_executor.py agent/agent_runtime_helpers.py agent/turn_context.py agent/turn_request_assembly.py agent/turn_api_request.py model_tools.py agent/turn_api_call.py agent/relay_llm.py hermes_cli/auth_codex_snapshot.py gateway/run.py agent/client_lifecycle.py agent/conversation_loop.py agent/codex_runtime.py agent/turn_api_error.py agent/turn_response_check.py
    rollback: disable provider execution first; cancel and read back guarded queued rows, preserve started or unknown receipts, then rebind prior immutable runtime only when no guarded work can be claimed by unaware code
    client_impact: restart_required
    tags: [api, authority, admission, controls]
    status: extracted
    route: irreducible
    reason: Local permission, freshness, input and control fences must linearize with native enqueue and exact queued-head claim. Delete would remove the accepted opt-in guarded owner-continuity outcome; the existing direct API has no equivalent atomic enqueue and queued-start fences. Config cannot enforce SQLite ordering, the existing plugin injector has no stable receipt, an upstream proposal cannot repair this qualified pin now, and a sidecar would add a second execution owner. The installed plugin loader supplies only protected provider identity and readers; native FIFO retains execution and controls.
    upstream_issue: none
    retirement_condition: upstream provides equivalent opt-in conditional direct API admission with immutable loader-owned grants, bounded outside-lock readers, native transactional enqueue and exact-head checks, durable input and control invalidation, spent effect identity and unchanged API receipts
