  - name: broker_oauth_pool_resync_v1
    module: modules/broker_oauth_pool_resync_v1.py
    function: patch_broker_oauth_pool_resync_v1
    target: agent/credential_pool.py + hermes_cli/auth.py
    owner: engineering-lead
    idempotency: HERMES_BROKER_OAUTH_POOL_RESYNC_v1
    test: python3 -m pytest -q bin/test/test_broker_oauth_pool_resync_v1.py
    smoke: python3 -m py_compile agent/credential_pool.py hermes_cli/auth.py
    rollback: rebind the prior immutable runtime through the operator executor; preserve credential pool state
    client_impact: restart_required
    tags: [auth, credential-pool, recovery]
    status: extracted
    route: irreducible
    reason: Broker-pushed OAuth pool entries carry no refresh_token; when the broker rotates the access token mid-turn, native _refresh_entry marks the entry exhausted for 60 minutes before checking auth.json for the newer token, and _merge_pool_row_generation copies that stale auth exhaustion onto the newly pushed token. Removing broker pooling loses shared subscription failover; config cannot alter in-process pool refresh or generation merge; no plugin hook owns _refresh_entry or write_credential_pool; an upstream PR is the retirement path but cannot repair pinned v0.23 runtimes now; and a sidecar cannot intercept in-process pool recovery.
    upstream_issue: none
    retirement_condition: upstream _refresh_entry and _resync_stale_entry adopt newer on-disk OAuth access tokens for refresh-token-less pool rows before benching, and _merge_pool_row_generation scopes stale 401/refresh exhaustion verdicts to the token generation they failed on
  - name: anthropic_403_pool_rotation_v1
