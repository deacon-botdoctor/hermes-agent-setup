patches:
  - name: llm_attempt_receipts_v1
    module: modules/llm_attempt_receipts_v1.py
    function: patch_llm_attempt_receipts_v1
    target: agent/conversation_loop.py + agent/chat_completion_helpers.py + agent/turn_finalizer.py + agent/auxiliary_client.py + agent/llm_attempt_receipts.py + agent/open_todo_stop.py + tests/run_agent/test_run_agent.py + tests/run_agent/test_open_todo_stop_guard.py
    owner: engineering-lead
    idempotency: HERMES_LLM_ATTEMPT_RECEIPTS_v1 + HERMES_XAI_ITERATION_SUMMARY_TOOLLESS_v1 + HERMES_OPEN_TODO_STOP_GUARD_v1
    test: python3 -m pytest -q bin/test/test_llm_attempt_receipts_v1.py bin/test/test_llm_attempt_receipts_stream_cleanup_v1.py bin/test/test_open_todo_stop_guard_v1.py tests/run_agent/test_open_todo_stop_guard.py
    rollback: restore the pre-apply snapshot and remove agent/llm_attempt_receipts.py, agent/open_todo_stop.py, tests/run_agent/test_open_todo_stop_guard.py, and state/llm-attempt-receipts.jsonl
    client_impact: restart_required
    tags: [llm, openrouter, xai, accounting, observability, receipts, fallback, streaming, client-safety, todo, continuation, research]
    status: extracted
    route: irreducible
    reason: main hooks identify logical calls while retries and auxiliary provider calls need one content-free terminal receipt per physical attempt before OpenRouter spend can be attributed safely; abandoned sync/async streams must close their provider resource and terminalize even during stopped or closed event-loop cleanup; toolless iteration summaries must also remove tool_choice and parallel_tool_calls as one request contract and keep raw provider failures out of client chat; the same finalization owner prevents a model from ending a foreground turn with a plan-only acknowledgement while its paired current-turn todo plan remains open.
    upstream_issue: null
    retirement_condition: remove when upstream emits terminal, content-free per-physical-attempt receipts for main and auxiliary calls with retry/fallback lineage and streaming coverage and refuses to finalize paired current-turn todo work while it is still pending or in progress.
