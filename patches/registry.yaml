      assembled-runtime gate also rejects canned copy, disconnected callbacks, changed lifecycle semantics, and raw
      tool-input retention before promotion.
    upstream_issue: null
    retirement_condition: remove when upstream periodic Telegram notifications can summarize newly emitted model commentary and skip rather than invent progress when none exists.
