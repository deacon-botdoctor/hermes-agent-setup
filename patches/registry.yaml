    client_impact: restart_required
    tags: [display, security, optional-provider]
    status: extracted
    route: irreducible
    reason: Delete/config/provider-only reuse cannot enforce native cross-process admission, tickets, startup and UI privacy ordering. An upstream PR is the retirement path but cannot supply this required source port on pinned SDK 2bd378ed, which lacks equivalent native consumers; no upstream issue or merged implementation is claimed. A sidecar would duplicate native lease/gateway/privacy ownership. One dormant external RFB branch requires native lease and lifecycle ownership; provider stays optional. Local drain is not remote cleanup qualification and active external publication remains blocked.
    upstream_issue: none
    retirement_condition: upstream supplies equivalent canonical external identity, positive typed lease, ordered per-link stream drain, all lifecycle/privacy consumers and qualified remote cleanup admission
