    function: patch_anthropic_403_pool_rotation_v1
    target: agent/error_classifier.py + agent/turn_recovery.py + agent/agent_runtime_helpers.py + agent/credential_auth_recovery.py + agent/credential_pool_model_cooldowns.py + agent/anthropic_credentials.py + agent/client_lifecycle.py + hermes_cli/runtime_provider.py
