    rollback: rebind the prior immutable runtime through the operator executor; preserve credential pool state
    client_impact: restart_required
    tags: [auth, credential-pool, recovery]
    status: extracted
    route: irreducible
    reason: Native _status_403 returns _V_AUTH_FALLBACK (should_rotate_credential=False), recover_auth_failure returns False immediately on Anthropic entitlement-shaped 403s (including "OAuth authentication is currently not allowed for this organization.") without honoring classified.should_rotate_credential, initial and reactive Anthropic pool binding (_resolve_from_pool / _pool_entry_mode_and_url / _rotate_after_anthropic_403 / _swap_credential) can pair native-only pool seats with third-party /anthropic proxy endpoints, and pre-dispatch Anthropic credential refresh (token_is_blocked / resolve_anthropic_token / _try_refresh_anthropic_client_credentials) ignores seat-wide exhaustion or leaves pinned/active-rollover seats on stale or blocked in-memory tokens instead of resyncing from the authoritative on-disk pool. Removing pooled failover loses multi-seat Anthropic resilience; config cannot alter _status_403 classification, in-process recover_auth_failure rotation ordering, runtime_provider pool binding, or pre-dispatch Anthropic token resolution; no plugin hook owns recover_auth_failure, _swap_credential, _resolve_from_pool, token_is_blocked, or _try_refresh_anthropic_client_credentials; an upstream PR is the retirement path but cannot repair pinned v0.23 runtimes now; and a sidecar cannot intercept in-process pool rotation or per-turn retry bounds.
    upstream_issue: none
    retirement_condition: upstream _status_403 marks explicit Anthropic credential-403s as should_rotate_credential=True while keeping non-credential, policy, and non-Anthropic 403s non-rotating, turn_recovery/agent_runtime_helpers/recover_auth_failure honor the single classifier decision to perform bounded CredentialPool rotation before provider fallback, initial and reactive Anthropic pool binding enforce endpoint compatibility so native-only seats are never bound or swapped onto third-party proxy endpoints, and pre-dispatch Anthropic credential resolution honors seat-wide exhaustion, endpoint compatibility, and authoritative on-disk broker token resync (failing closed when blocked with no healthy replacement) for both normal and active subscription-rollover pinned seats
