    test: python3 -m pytest -q bin/test/test_durable_drain_inbox_carrier_v1.py bin/test/test_cron_scheduler_can_dispatch_compat_v1.py
    rollback: restore the pre-apply snapshot and remove .golden-runtime-carriers/durable-drain-inbox-v1.json
    client_impact: restart_required
    tags: [gateway, restart, maintenance, durable-inbox, startup-barrier, windows, cron, fleet]
    status: extracted
    route: hotfix
    reason: current Hermes has shutdown flush but not durable maintenance admission/replay; the carrier supplies that missing lifecycle, steers concise maintenance context into active work, folds in cross-platform row/path safety, and adds the optional cron drain callback.
    upstream_issue: null
    retirement_condition: remove the full subsystem when upstream.lock contains equivalent durable recovery, cross-platform path/row handling, and drain-aware cron startup.

  - name: lifecycle_guard_invalid_path_v1
    module: modules/lifecycle_guard_invalid_path_v1.py
    function: patch_lifecycle_guard_invalid_path_v1
    target: cron/lifecycle_guard.py
    owner: engineering-lead
    idempotency: HERMES_LIFECYCLE_GUARD_INVALID_PATH_v1 + HERMES_LIFECYCLE_GUARD_INVALID_PATH_RESOLVE_v2
    test: python3 -m pytest -q bin/test/test_lifecycle_guard_invalid_path_v1.py
    rollback: restore cron/lifecycle_guard.py from the pre-apply snapshot or its .bak-pre-lifecycle-guard-invalid-path-v1 sibling
    client_impact: restart_required
    tags: [cron, terminal, lifecycle, invalid-path, reliability, client-safety]
    status: extracted
    route: upstream-pr-pending
    reason: Hermes v0.20 lets embedded-NUL paths escape both Path.expanduser during nested script resolution and os.open during referenced-script reads, crashing the terminal tool and stalling the active agent turn.
    upstream_issue: null
    retirement_condition: remove when upstream catches invalid path values at both nested resolution and referenced-script open boundaries and retains direct regressions for each path.

