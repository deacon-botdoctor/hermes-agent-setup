# config.example.yaml — the client-ready runtime skeleton.
#
# This is the drag-and-drop core: copy it in, fill the <placeholders>, and the agent behaves
# correctly for a client out of the box — the right reply rules, muted tool chatter, no
# streaming, clean output — without hand-tuning. Every value is a <placeholder>; never commit
# real tokens or ids.
#
# The reply-rules block is the point of this file. It's why a client can run the agent without
# an operator babysitting message quality.

_config_version: 1
client_identity: <client-slug>

# ─────────────────────────────────────────────────────────────────────────────
# REPLY RULES — how the agent talks to a client. The heart of the bundle.
# ─────────────────────────────────────────────────────────────────────────────

# No streaming. Clients get a complete, composed message, not token-by-token output.
streaming: false

# Plain messages, not the upstream rich-message decoration. (A custom delivery/readability
# transform lives in the immersion plugin instead — see plugins/immersion.)
rich_messages: false

# Muting: keep operational chatter off client lanes. Every event below is an operator concern,
# not something a client should see. All false.
notifications:
  tool_step_intermediate: false     # <-- "mute tool calls": no intermediate tool-step pings
  compression_events: false         # context compaction is invisible to the client
  session_reset_events: false
  provider_fallback_events: false   # a model fallover is silent to the client
  provider_warning_events: false
  background_process_notifications: false
  gateway_restart_notifications: false
  gateway_status_messages: false

# Busy handling: acknowledge nothing extra, and queue incoming messages rather than interrupting
# in-flight work. (The /mode command in the immersion plugin can flip queue<->interrupt live.)
busy_ack: false
busy_ack_detail: false
busy_input_mode: queue

# ─────────────────────────────────────────────────────────────────────────────
# EXECUTION — what the agent can do, and the CLI-vs-gateway split.
# ─────────────────────────────────────────────────────────────────────────────
code_execution:
  timeout: 300          # seconds per code-execution tool call
  max_tool_calls: 90    # cap tool calls per turn

agent:
  max_turns: 60
  reasoning_effort: medium
  gateway_notify_interval: 600
  gateway_timeout: 300

terminal:
  enabled: true

# Web scraping/crawl backend. firecrawl is the default. Run it LOCALLY (self-hosted, no API key)
# by pointing firecrawl_url at a local instance, or use the hosted API with a key.
#   local self-hosted:  firecrawl_url: http://127.0.0.1:3002   (see docs/firecrawl.md to run it)
#   hosted API:         firecrawl_url: https://api.firecrawl.dev  (set FIRECRAWL_API_KEY)
web:
  backend: firecrawl
  firecrawl_url: http://127.0.0.1:3002        # local self-hosted; swap to the hosted API if you prefer
  # SECURITY WARNING: these client/Telegram defaults expose web browsing, shell access, and
  # code execution with no approval gate. Use them only for trusted clients/operators.
  # For UNTRUSTED clients, narrow `telegram` by dropping terminal/code_execution/web or set
  # approvals.mode to 'on'.
  # Per-surface toolsets. Both get the full set by default — an agent that can't run
  # code_execution/terminal on the chat lane fails the moment it needs them. Narrow `telegram`
  # yourself ONLY if you want a locked-down customer-facing lane; do not narrow it by default.
  cli:      [clarify, code_execution, file, memory, session_search, skills, terminal, todo, tts, web]
  telegram: [clarify, code_execution, file, memory, session_search, skills, terminal, todo, tts, web]

# ─────────────────────────────────────────────────────────────────────────────
# APPROVALS / permissions — how much the agent asks before acting.
# ─────────────────────────────────────────────────────────────────────────────
# mode: 'off'  = no permission prompts; the agent just acts (unattended / client-facing default).
# mode: 'on'   = the agent asks before sensitive actions (operator/supervised use).
# 'off' is the right default for a client-facing bot that must run without you approving each step;
# only turn it on for a lane where a human is watching and wants a gate.
# SECURITY WARNING: with the full Telegram toolset above, mode 'off' lets Telegram users invoke
# terminal, code_execution, and web without an operator approval prompt.
approvals:
  mode: 'off'
  timeout: 60

# ─────────────────────────────────────────────────────────────────────────────
# MEMORY — the agent's own recall (distinct from the canonical GBrain layer).
# ─────────────────────────────────────────────────────────────────────────────
memory:
  memory_enabled: true
  memory_char_limit: 2200   # cap injected-memory size so recall doesn't crowd the prompt
# The provider is a plugin — see plugins/memory (local SQLite-FTS, or GBrain-backed).

context:
  engine: lcm

# ─────────────────────────────────────────────────────────────────────────────
# COMPRESSION — keep autoraise on (off drops compaction drastically); notice is suppressed
# by the overlay, see overlay/modules/suppress_codex_autoraise_notice.py.
# ─────────────────────────────────────────────────────────────────────────────
compression:
  codex_gpt55_autoraise: true

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY — redaction on. Non-negotiable; secrets in tool output otherwise persist.
# ─────────────────────────────────────────────────────────────────────────────
redaction:
  enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# SKILLS — a curated allowlist, not an alphabetical dump.
# ─────────────────────────────────────────────────────────────────────────────
skills:
  index_allowlist:
    - <core-skill-1>
    - <core-skill-2>

# ─────────────────────────────────────────────────────────────────────────────
# CANONICAL KNOWLEDGE — wire the agent to a GBrain library (see gbrain/README.md).
# ─────────────────────────────────────────────────────────────────────────────
gbrain:
  enabled: true
  chat_model: <provider:model>   # e.g. a small, cheap chat model for the router
  engine: postgres               # compiled-binary launcher, not a source checkout

# ─────────────────────────────────────────────────────────────────────────────
# TOOLS / MCP — canonical real-client floor.
#
# Re-enumerated from live client-standard runtimes: the shared floor is the hot capability
# router plus on-demand knowledge, search, browser, document, memory, visual identity, and
# Telegram-admin surfaces. Other MCPs are client-specific and belong in an overlay, not this
# public default.
# ─────────────────────────────────────────────────────────────────────────────
mcp_policy:
  hot_path_enabled:
    - capability-router
  on_demand:
    - anamnesis
    - browser
    - browser-lane
    - gbrain
    - local-document-tools
    - search
    - telegram-admin
    - visual-identity
    - web-search

mcp_servers:
  capability-router:
    tier: hot
    command: <python -m capability_router.server>
    env:
      PYTHONPATH: <repo>/mcp-servers/capability-router/src
      CAPABILITY_REGISTRY: <repo>/mcp-servers/capability-router/registry.json
      # Optional; defaults to ~/.hermes/state/capability-router-usage.db.
      CAPABILITY_USAGE_DB: <state-dir>/capability-router-usage.db
  anamnesis:
    tier: on_demand
    command: <anamnesis-mcp-command>
  browser:
    tier: on_demand
    command: <browser-mcp-command>
  browser-lane:
    tier: on_demand
    command: <browser-lane-mcp-command>
  gbrain:
    tier: on_demand
    command: <gbrain serve>
    metadata:
      resources: true
  local-document-tools:
    tier: on_demand
    command: <local-document-tools-mcp-command>
  search:
    tier: on_demand
    command: <search-mcp-command>
  telegram-admin:
    tier: on_demand
    command: <telegram-admin-mcp-command>
  visual-identity:
    tier: on_demand
    command: <visual-identity-mcp-command>
  web-search:
    tier: on_demand
    command: <web-search-mcp-command>

mcp_proxy:
  enabled: true

delegation:
  model: gpt-5.5
  max_iterations: 90
  default_toolsets: [terminal, file, web]

plugins:
  enabled:
    - composio-onboarding
    - hermes-lcm
    - Task Ledger
    - Telegram Transcript
    - autoDream

# ─────────────────────────────────────────────────────────────────────────────
# PLATFORMS + MODEL
# ─────────────────────────────────────────────────────────────────────────────
platforms:
  api_server:
    enabled: true
  telegram:
    enabled: true
telegram:
  bot_token: <YOUR_BOT_TOKEN>    # from BotFather. NEVER commit the real token.

model:
  default: gpt-5.5
  provider: openai-codex
  temperature: 0.2
  max_tokens: 32768
  context_length: 1048576

providers:
  fallback:
    max_attempts: 3
    cooldown_seconds: 300
    circuit_breaker:
      enabled: true

fallback_providers:
  - provider: openrouter
    model: z-ai/glm-5.2
    api_key_env: OPENROUTER_API_KEY
  - provider: openrouter
    model: anthropic/claude-sonnet-5
    api_key_env: OPENROUTER_API_KEY
