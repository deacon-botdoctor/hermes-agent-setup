minimum_pre_commit_version: '4.5.1'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-json
      - id: check-yaml
      - id: detect-private-key
      - id: check-case-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 45ef068da5f21267bb2a7ec4a623092959f09ce5  # v0.14.14
    hooks:
      - id: ruff-check
        args: [--no-cache, --select, 'E9,F63,F7,F82,B006,B012,S307']
        # This fragment is inserted into a host module that supplies its names.
        exclude: '(^patches/payloads/human-auth-handoff-computer-use-v0/d363_safety\.py$|^bin/test/fixtures/apply-all-patches-syntax-error\.py$)'
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=info]
        exclude: '\.zsh$'
  - repo: local
    hooks:
      - id: generated-state
        name: keep generated state and credential files out of source
        language: fail
        entry: 'Remove generated state or credentials from the commit; use a sanitized text fixture when a test needs one.'
        files: '(^|/)(__pycache__/|\.pytest_cache/|node_modules/|\.venv/|[^/]*\.py[co]$|\.env$|\.env\.(local|development|production|test)$|id_(rsa|ed25519)$|credentials\.json$)'
      - id: release-contracts
        name: public release and installation contracts
        language: python
        entry: python -B -m pytest -q -p no:cacheprovider --timeout=30 tests/test_public_release.py tests/test_cua_driver_install.py tests/test_canary_reconciler.py tests/test_llm_attempt_receipts.py tests/test_semantic_computer_control.py
        pass_filenames: false
        always_run: true
        additional_dependencies: [pytest==9.1.1, PyYAML==6.0.3, pytest-timeout==2.4.0]
