# Old per-agent tuning overrides, removed so each agent uses the pinned build's
# native default. the operator, 2026-11-16: "a lot of those technical knobs can go away
# probably poor add ons I did out of frustration before I moved to coding better"
# and "simple is better lets get out of our own damn way".
#
# Each path was checked against Golden's template and shared defaults (no
# deliberate value), the fleet decision pages, and an exact-name code search of
# Golden and the runtime for custom readers. Recorded exemptions in
# fleet-exemptions.yaml win. Deliberately not listed (they still have users or
# a removal would add prompts, change channels or access, or cut retention):
# hooks_auto_accept, jobs.*, durable_runtime*, mcp_proxy.*, memory_upgrades,
# logging.*, operator_alerts.*, web.*, browser.engine/cloud_provider, display.*,
# streaming.*, platforms.*, providers.*, model_catalog.excluded_providers,
# tools.disabled, thread/group session isolation, browser.camofox.*,
# updates.pre_update_backup, session_reset.*, kanban.dispatch_in_gateway,
# browser.record_sessions, terminal backend images, plugins, toolsets, cron, sessions,
# memory, security, approvals and model routing.
