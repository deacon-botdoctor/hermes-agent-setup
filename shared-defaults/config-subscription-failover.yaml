# Consumed only by the dedicated subscription reconciliation path.
# Primary routing and tenant credentials remain client-owned.
# Fleet default is anthropic / claude-opus-5-5 (medium); governed backup order is
# xai-oauth / grok-4.7 first, then openai-codex / gpt-6.2-sol second.
order:
  - xai-oauth
  - openai-codex
routes:
  xai-oauth:
    provider: xai-oauth
    model: grok-4.7
    base_url: https://api.x.ai/v1
  openai-codex:
    provider: openai-codex
    model: gpt-6.2-sol
    base_url: https://chatgpt.com/backend-api/codex
