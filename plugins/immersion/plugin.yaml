name: immersion
label: Immersion policy pack
kind: standalone
version: 0.1.0
description: >
  The reply-rules pack. Hosts the output transforms and LLM-request middleware that keep client
  message quality right without an operator tuning it, plus the /mode queue|interrupt command.
  This is where the message-quality behaviors live as a durable plugin instead of fragile
  source patches.
provides_hooks:
  - transform_llm_output      # clean up the outbound message a client sees
provides_middleware:
  - llm_request               # clean up the request history before it goes to the provider
provides_commands:
  - mode                      # /mode queue|interrupt at runtime
