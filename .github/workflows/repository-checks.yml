name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned check runner
        run: python -m pip install pre-commit==4.5.1
      - name: Check changed source and regression contracts
        run: python -m pre_commit run --from-ref "$CHECK_BASE" --to-ref HEAD --show-diff-on-failure
      - name: Scan candidate commits for credentials
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          base: ${{ env.CHECK_BASE }}
          head: HEAD
          version: '3.97.4'
          extra_args: --results=verified,unknown
