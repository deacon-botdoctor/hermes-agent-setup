# registry.yaml — the overlay manifest.
#
# One entry per change you make to the stock runtime. The apply engine reads this top to bottom.
# `module` names a file in modules/ (without .py). `rung` records where on the change ladder the
# change sits, so a reviewer can see at a glance what should eventually move to config/plugin or
# be deleted. `retire_when` is the condition under which this entry should go away — a patch with
# no retirement condition is debt with no exit.
#
# Only ONE module below ships as working code in this kit (suppress_codex_autoraise_notice) plus
# the copy-me template. The rest are listed as the real shape of a mature overlay so you can see
# the whole map; fill each in as a module when you actually hit its problem. Rehearse before you
# deploy any of them — anchors are version-specific.
#
# NOTE — what is deliberately NOT here (pushed higher up the ladder):
#   * Reply rules (no streaming, mute tool chatter, plain messages)  -> config/config.example.yaml
#   * Message-quality transforms (strip internal notes, suppress interrupted-final, mask model
#     failures, redact secrets from output) and tool-result-history elision -> plugins/immersion
#     (the durable home — these do NOT belong as fragile patches)
#   * Human-voiced 10-min progress updates                             -> bin/progress-compose.py + tasks/
#   * Media / adapter hardening, media-in-replies, PDF ingest         -> plugins/telegram_platform
#   * Memory                                                          -> plugins/memory
#   * Canonical knowledge                                             -> gbrain/ (external product)
# Only behaviors with NO config knob and NO plugin seam stay as patches below. See docs/wiring.md.

patches:
  # ── security · never cut ────────────────────────────────────────────────────
  - name: redact_session_write
    module: redact_session_write        # TODO: implement — scrub secrets before persist
    rung: patch
    target: gateway/session.py
    retire_when: upstream adds a redaction hook at the transcript write boundary

  # RETIRED display_redact: moved to plugins/immersion (transform_llm_output →
  # redact_secrets_from_output). Scrubbing the client-bound message is the surface that matters;
  # no source patch needed.

  # ── durable execution & clean restarts ──────────────────────────────────────
  - name: durable_runtime
    module: durable_runtime             # TODO: implement — resume work across restarts
    rung: patch
    target: gateway/run.py
    retire_when: upstream ships durable execution

  - name: clean_restart_resume_scheduler
    module: clean_restart_resume_scheduler   # TODO: implement — one startup resume decision
    rung: patch
    target: gateway/run.py
    retire_when: upstream centralizes restart resume

  - name: active_task_anchor
    module: active_task_anchor          # TODO: implement — pin task through compression
    rung: patch
    target: gateway/run.py
    retire_when: upstream grows a per-turn task hook

  # RETIRED long_running_checkpoints: carried by bin/progress-compose.py + the tasks/ trigger
  # (the human-voiced 10-min updates). The behavior is a scheduled tool, not a gateway patch.

  # ── tooling · housekeeping ──────────────────────────────────────────────────
  - name: session_search_current_topic
    module: session_search_current_topic  # TODO: move to a register_tool plugin
    rung: plugin
    target: tools/session_search_tool.py
    retire_when: shipped as a register_tool plugin

  - name: skill_index_allowlist
    module: skill_index_allowlist       # TODO: prefer config skills.index_allowlist
    rung: config
    target: agent/prompt_builder.py
    retire_when: upstream prompt_builder reads skills.index_allowlist

  # ── working reference module (ships in this kit) ─────────────────────────────
  - name: suppress_codex_autoraise_notice
    module: suppress_codex_autoraise_notice
    rung: patch
    target: agent/agent_init.py
    retire_when: upstream stops emitting the startup notice, or exposes a notice-off config
